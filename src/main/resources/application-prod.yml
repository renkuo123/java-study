spring:
  data:
    mongodb:
      uri: ${MONGODB_URI}
    # ====== 生产环境 Redis 配置 ======
    # ${...} 是 Spring 的占位符语法，会从环境变量中读取值
    # ${REDIS_HOST:localhost} 表示：优先读环境变量 REDIS_HOST，如果没有则用 localhost 作为默认值
    # 这种写法类似前端 .env 文件中的 VITE_API_URL=${API_URL:-http://localhost:3000}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}

logging:
  level:
    root: WARN
    com.xyqb.platform: INFO
